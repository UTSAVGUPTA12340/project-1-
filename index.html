    <h1>Hotel Room Booking Form</h1>
    <form action="#" method="Post ">
        <label for = "Name">Full Name:</label>
        <input type = "text" id="Name" placeholder="Enter your name">
        </form>

        <br><br>
        <label for = "Phone">Phone number:</label>
        <input type = "phone" id = "phone" placeholder="Enter your phone">

        <br><br>
        <label for = "Email"> Email:</label>
        <input type = "Email" id = "Email" placeholder = "Enter your Email" required>

        <br><br>
        <label for="roomtype">Room Type:</label>
        <select id="roomtype">
            <option value = "">Choose Room Type </option>
            <option value = "Single">Single</option>
            <option value = "double">double</option>
            <option value = "Suit">Suit</option>


        </select><br><br>
        <label for="Guests">Number of Guests:</label>
        <input type="number" id="Guests" min="1" max="10"><br>

        <br>
        <label for="Special request">Special Request:</label>
        <textarea id="Special request" rows="4" col="50" placeholder="Enter any special requests here...">
        




        </textarea>
        <input type="submit" value="Book Value">
        <input type= "reset" value="reset now">
    </form>

     
    
    
</body>
